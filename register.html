<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register to DSARPro">
    <title>Register | DSARPro</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        .auth-container {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }
        .auth-center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            background: var(--bg-main);
            position: relative;
        }

        .auth-form-wrapper {
            width: 100%;
            max-width: 500px;
        }
        .auth-brand {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            text-decoration: none;
        }
        .auth-card {
            background: var(--bg-secondary);
            padding: 3rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
        }
        .theme-toggle-fixed {
            position: absolute;
            top: 2rem;
            right: 2rem;
            display: flex;
            gap: 0.5rem;
        }

        @media (max-width: 480px) {
            .auth-center {
                flex-direction: column;
                padding: 2rem 1.5rem;
                justify-content: center;
            }
            .theme-toggle-fixed {
                position: static;
                width: 100%;
                max-width: 500px;
                justify-content: flex-end;
                margin-bottom: 1rem;
            }
            .auth-card {
                padding: 2rem 1.5rem;
            }
        }

        @media (max-width: 360px) {
            .auth-center {
                padding: 1.5rem 1rem;
            }
            .auth-card {
                padding: 2rem 1rem;
            }
        }

        /* Password Strength */
        .strength-meter {
            height: 4px;
            background: var(--border-color);
            margin-top: 0.5rem;
            border-radius: 2px;
            overflow: hidden;
        }
        .strength-bar {
            height: 100%;
            width: 0;
            transition: width 0.3s, background 0.3s;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Main Content -->
        <div class="auth-center">
            <div class="theme-toggle-fixed">
                <button id="theme-btn" class="icon-btn" title="Toggle Dark Mode"><i class="ri-moon-line"></i></button>
                <button id="rtl-btn" class="icon-btn" title="Toggle RTL"><i class="ri-arrow-left-right-line"></i></button>
            </div>
            
            <div class="auth-form-wrapper reveal auth-card">
                <a href="index.html" class="auth-brand"><i class="ri-shield-keyhole-fill"></i> DSARPro</a>
                <h2 style="margin-bottom: 0.5rem; text-align: center;">Create your account</h2>
                <p style="color: var(--text-muted); margin-bottom: 2.5rem; text-align: center;">Start your 14-day free trial. No credit card required.</p>
                
                <form id="register-form" action="dashboard.html">
                    <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">First Name</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Last Name</label>
                            <input type="text" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Work Email</label>
                        <input type="email" class="form-control" placeholder="name@company.com" required>
                    </div>
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Password</label>
                        <div style="position: relative;">
                            <input type="password" id="password" class="form-control" placeholder="••••••••" required style="padding-right: 3rem;">
                            <button type="button" class="toggle-password" data-target="password" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 0; display: flex; align-items: center; z-index: 10;">
                                <i class="ri-eye-line eye-icon"></i>
                            </button>
                        </div>
                        <div class="strength-meter"><div id="strength-bar" class="strength-bar"></div></div>
                        <p id="strength-text" style="font-size: 0.8rem; margin-top: 0.3rem; color: var(--text-muted);">Use 8+ characters with a mix of letters, numbers & symbols</p>
                    </div>
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Confirm Password</label>
                        <div style="position: relative;">
                            <input type="password" id="confirm-password" class="form-control" placeholder="••••••••" required style="padding-right: 3rem;">
                            <button type="button" class="toggle-password" data-target="confirm-password" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 0; display: flex; align-items: center; z-index: 10;">
                                <i class="ri-eye-line eye-icon"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group" style="display: flex; align-items: flex-start; gap: 0.5rem;">
                        <input type="checkbox" id="terms" required style="margin-top: 0.3rem;">
                        <label for="terms" style="font-size: 0.9rem; color: var(--text-muted);">I agree to the <a href="#" style="color: var(--primary);">Terms of Service</a> and <a href="#" style="color: var(--primary);">Privacy Policy</a>.</label>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; margin-top: 1rem;">Create Account</button>
                </form>
                
                <div style="margin-top: 2rem; text-align: center;">
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600;">Sign in</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
        const password = document.getElementById('password');
        const strengthBar = document.getElementById('strength-bar');
        
        password.addEventListener('input', function() {
            const val = password.value;
            let strength = 0;
            if(val.length > 5) strength += 1;
            if(val.length > 7) strength += 1;
            if(/[A-Z]/.test(val)) strength += 1;
            if(/[0-9]/.test(val)) strength += 1;
            if(/[^A-Za-z0-9]/.test(val)) strength += 1;

            if(val.length === 0) {
                strengthBar.style.width = '0%';
            } else if(strength <= 2) {
                strengthBar.style.width = '33%';
                strengthBar.style.background = '#ef4444';
            } else if(strength <= 4) {
                strengthBar.style.width = '66%';
                strengthBar.style.background = '#f59e0b';
            } else {
                strengthBar.style.width = '100%';
                strengthBar.style.background = '#10b981';
            }
        });

        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const passwordValue = password.value;
            const confirmPasswordValue = document.getElementById('confirm-password').value;
            
            if (passwordValue !== confirmPasswordValue) {
                alert("Passwords do not match!");
                return;
            }
            
            window.location.href = 'dashboard.html';
        });

        // Password Toggle Logic
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const input = document.getElementById(targetId);
                const icon = this.querySelector('.eye-icon');
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                icon.className = type === 'password' ? 'ri-eye-line eye-icon' : 'ri-eye-off-line eye-icon';
            });
        });
    </script>
    <!-- Back to Top Button -->`n    <div id="backToTop" class="back-to-top">`n        <i class="ri-arrow-up-line"></i>`n    </div>`n`n</body>
</html>
