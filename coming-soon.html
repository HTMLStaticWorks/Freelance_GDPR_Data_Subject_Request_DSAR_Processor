<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DSARPro Coming Soon">
    <title>Coming Soon | DSARPro</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        .coming-soon-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, var(--bg-main) 0%, var(--bg-secondary) 100%);
            position: relative;
            overflow: hidden;
        }
        .coming-soon-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            background: var(--card-bg);
            padding: 4rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }
        .countdown {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 3rem 0;
            flex-wrap: wrap;
        }
        .time-box {
            background: var(--bg-secondary);
            padding: 1.5rem;
            border-radius: var(--radius-md);
            min-width: 100px;
            border: 1px solid var(--border-color);
        }
        .time-box h2 {
            font-size: 3rem;
            color: var(--primary);
            margin: 0 0 0.5rem;
        }
        .time-box span {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-weight: 600;
        }
        @media (max-width: 640px) {
            .countdown { gap: 1rem; }
            .time-box { min-width: 80px; padding: 1rem; }
            .time-box h2 { font-size: 2rem; }
            .coming-soon-content { padding: 2rem; }
        }
    </style>
</head>
<body>

    <div class="coming-soon-page">
        <!-- Theme toggle fixed top right -->
        <div style="position: absolute; top: 2rem; right: 2rem; z-index: 10;">
            <button id="theme-btn" class="icon-btn" title="Toggle Dark Mode" style="background: var(--card-bg); box-shadow: var(--shadow-sm);"><i class="ri-moon-line"></i></button>
        </div>

        <div class="coming-soon-content reveal">
            <a href="index.html" class="nav-brand" style="justify-content: center; margin-bottom: 2rem;">
                <i class="ri-shield-keyhole-fill" style="font-size: 3rem;"></i> 
                <span style="font-size: 2.5rem;">DSARPro</span>
            </a>
            
            <h1 style="margin-bottom: 1rem;">We're upgrading our security infrastructure.</h1>
            <p style="color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto;">Our new enterprise privacy features will be launching soon. Enter your email below to get notified when we're live.</p>
            
            <div class="countdown" id="countdown">
                <div class="time-box">
                    <h2 id="days">00</h2>
                    <span>Days</span>
                </div>
                <div class="time-box">
                    <h2 id="hours">00</h2>
                    <span>Hours</span>
                </div>
                <div class="time-box">
                    <h2 id="minutes">00</h2>
                    <span>Mins</span>
                </div>
                <div class="time-box">
                    <h2 id="seconds">00</h2>
                    <span>Secs</span>
                </div>
            </div>
            
            <form style="display: flex; gap: 1rem; max-width: 500px; margin: 0 auto 3rem; flex-wrap: wrap;">
                <input type="email" class="form-control" placeholder="Enter your email address" required style="flex: 1; min-width: 250px;">
                <button type="submit" class="btn btn-primary">Notify Me</button>
            </form>
            
            <div class="social-links" style="justify-content: center; gap: 1.5rem;">
                <a href="#" class="social-icon" style="width: 45px; height: 45px; font-size: 1.2rem;"><i class="ri-facebook-fill"></i></a>
                <a href="#" class="social-icon" style="width: 45px; height: 45px; font-size: 1.2rem;"><i class="ri-twitter-x-line"></i></a>
                <a href="#" class="social-icon" style="width: 45px; height: 45px; font-size: 1.2rem;"><i class="ri-linkedin-fill"></i></a>
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
        // Set the date we're counting down to (30 days from now)
        const countDownDate = new Date();
        countDownDate.setDate(countDownDate.getDate() + 30);
        const targetDate = countDownDate.getTime();

        // Update the count down every 1 second
        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = days < 10 ? '0' + days : days;
            document.getElementById("hours").innerHTML = hours < 10 ? '0' + hours : hours;
            document.getElementById("minutes").innerHTML = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById("seconds").innerHTML = seconds < 10 ? '0' + seconds : seconds;

            if (distance < 0) {
                clearInterval(x);
                document.getElementById("countdown").innerHTML = "<h2>WE ARE LIVE!</h2>";
            }
        }, 1000);
    </script>
    <!-- Back to Top Button -->`n    <div id="backToTop" class="back-to-top">`n        <i class="ri-arrow-up-line"></i>`n    </div>`n`n</body>
</html>
