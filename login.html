<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to DSARPro">
    <title>Login | DSARPro</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        .auth-container {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        .auth-left {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            background: var(--bg-main);
            position: relative;
        }

        .auth-form-wrapper {
            width: 100%;
            max-width: 400px;
        }

        .auth-brand {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            text-decoration: none;
        }

        .auth-card {
            background: var(--bg-secondary);
            padding: 3rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
        }

        .theme-toggle-fixed {
            position: absolute;
            top: 2rem;
            right: 2rem;
            display: flex;
            gap: 0.5rem;
        }

        @media (max-width: 480px) {
            .auth-left {
                flex-direction: column;
                padding: 2rem 1.5rem;
                justify-content: center;
            }
            .theme-toggle-fixed {
                position: static;
                width: 100%;
                max-width: 400px;
                justify-content: flex-end;
                margin-bottom: 1rem;
            }
            .auth-card {
                padding: 2rem 1.5rem;
            }
            .auth-footer-row {
                gap: 0.5rem;
            }
            .remember-me-label {
                white-space: nowrap;
            }
            .forgot-link {
                white-space: nowrap;
            }
        }

        @media (max-width: 360px) {
            .auth-left {
                padding: 1.5rem 1rem;
            }
            .auth-card {
                padding: 2rem 1rem;
            }
            .remember-me-label, .forgot-link {
                font-size: 0.85rem !important;
            }
        }

        .social-btn {
            flex: 1;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.8rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .social-btn:hover {
            background: var(--bg-secondary);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <!-- Left Side: Form -->
        <div class="auth-left">
            <div class="theme-toggle-fixed">
                <button id="theme-btn" class="icon-btn" title="Toggle Dark Mode"><i class="ri-moon-line"></i></button>
                <button id="rtl-btn" class="icon-btn" title="Toggle RTL"><i
                        class="ri-arrow-left-right-line"></i></button>
            </div>

            <div class="auth-form-wrapper reveal auth-card">
                <a href="index.html" class="auth-brand"><i class="ri-shield-keyhole-fill"></i> DSARPro</a>
                <h2 style="margin-bottom: 0.5rem; text-align: center;">Welcome Back</h2>
                <p style="color: var(--text-muted); margin-bottom: 2.5rem; text-align: center;">Sign in to access your
                    privacy dashboard.</p>

                <form id="login-form" action="dashboard.html">
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Work Email</label>
                        <input type="email" class="form-control" placeholder="name@company.com" required>
                    </div>
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Password</label>
                        <div style="position: relative;">
                            <input type="password" id="password" class="form-control" placeholder="••••••••" required
                                style="padding-right: 3rem;">
                            <button type="button" id="toggle-password"
                                style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 0; display: flex; align-items: center; z-index: 10;">
                                <i class="ri-eye-line" id="eye-icon"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group auth-footer-row"
                        style="display: flex; align-items: center; justify-content: space-between; margin-top: -0.5rem;">
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <input type="checkbox" id="remember">
                            <label for="remember" class="remember-me-label"
                                style="font-size: 0.9rem; color: var(--text-muted);">Remember me
                            </label>
                        </div>
                        <a href="#" class="forgot-link" style="color: var(--primary); font-size: 0.9rem;">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary"
                        style="width: 100%; padding: 1rem; margin-top: 1rem;">Sign In</button>
                    
                    <div style="margin: 1.5rem 0; display: flex; align-items: center; gap: 1rem; color: var(--text-muted); font-size: 0.9rem;">
                        <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
                        <span>OR</span>
                        <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
                    </div>

                    <div style="display: flex; gap: 1rem;">
                        <button type="button" class="btn social-btn">
                            <i class="ri-google-fill" style="color: #DB4437; font-size: 1.2rem;"></i> Google
                        </button>
                        <button type="button" class="btn social-btn">
                            <i class="ri-apple-fill apple-icon" style="font-size: 1.2rem;"></i> Apple
                        </button>
                    </div>
                </form>

                <div style="margin-top: 2rem; text-align: center;">
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Don't have an account? <a
                            href="register.html" style="color: var(--primary); font-weight: 600;">Create an account</a>
                    </p>
                </div>
            </div>
        </div>

    </div>

    <script src="assets/js/main.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();
            // Basic validation simulation
            window.location.href = 'dashboard.html';
        });

        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.className = type === 'password' ? 'ri-eye-line' : 'ri-eye-off-line';
        });
    </script>
    <!-- Back to Top Button -->
    <div id="backToTop" class="back-to-top">
        <i class="ri-arrow-up-line"></i>
    </div>

</body>

</html>
