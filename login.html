<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to DSARPro">
    <title>Login | DSARPro</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        .auth-container {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }
        .auth-left {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            background: var(--bg-main);
            position: relative;
        }
        .auth-right {
            flex: 1;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            color: #fff;
            position: relative;
            overflow: hidden;
        }
        .auth-right::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            animation: rotate 20s linear infinite;
        }
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .auth-form-wrapper {
            width: 100%;
            max-width: 400px;
        }
        .auth-brand {
            position: absolute;
            top: 2rem;
            left: 2rem;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .theme-toggle-fixed {
            position: absolute;
            top: 2rem;
            right: 2rem;
        }
        @media (max-width: 768px) {
            .auth-right { display: none; }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Left Side: Form -->
        <div class="auth-left">
            <a href="index.html" class="auth-brand"><i class="ri-shield-keyhole-fill"></i> DSARPro</a>
            <div class="theme-toggle-fixed">
                <button id="theme-btn" class="icon-btn" title="Toggle Dark Mode"><i class="ri-moon-line"></i></button>
            </div>
            
            <div class="auth-form-wrapper reveal">
                <h2 style="margin-bottom: 0.5rem;">Welcome Back</h2>
                <p style="color: var(--text-muted); margin-bottom: 2.5rem;">Sign in to access your privacy dashboard.</p>
                
                <form id="login-form" action="dashboard.html">
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Work Email</label>
                        <input type="email" class="form-control" placeholder="name@company.com" required>
                    </div>
                    <div class="form-group" style="position: relative;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <label style="font-weight: 500;">Password</label>
                            <a href="#" style="color: var(--primary); font-size: 0.9rem;">Forgot password?</a>
                        </div>
                        <input type="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="checkbox" id="remember">
                        <label for="remember" style="font-size: 0.9rem; color: var(--text-muted);">Remember me for 30 days</label>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; margin-top: 1rem;">Sign In</button>
                </form>
                
                <div style="margin-top: 2rem; text-align: center;">
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600;">Create an account</a></p>
                </div>
            </div>
        </div>
        
        <!-- Right Side: Illustration -->
        <div class="auth-right">
            <div style="position: relative; z-index: 1; max-width: 500px; text-align: center;">
                <img src="https://images.unsplash.com/photo-1555949963-ff9fe0c870eb?auto=format&fit=crop&q=80&w=800" alt="Secure Login" style="width: 100%; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); margin-bottom: 2rem;">
                <h2>Enterprise Grade Security</h2>
                <p style="color: rgba(255,255,255,0.8);">Your data is protected by AES-256 encryption and zero-trust architecture.</p>
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            // Basic validation simulation
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
